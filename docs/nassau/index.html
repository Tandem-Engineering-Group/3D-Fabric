<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nassau ’26</title>
</head>
<body>
<style>
  :root {
    --paper: #F6F3EC; --card: #FFFFFF; --ink: #22292E; --muted: #5D6A6E; --line: #DDD8CB;
    --sea: #1E7E8C; --sea-deep: #14606C; --sea-soft: #E1F0F1; --coral: #C65D3B; --on-sea: #FFFFFF;
    --red: #B3403A;
    --wave1: #BFE0E4; --wave2: #8FC8CF; --wave3: #5AA9B4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0E1518; --card: #1C252A; --ink: #E9ECE7; --muted: #98A6A8; --line: #303C41;
      --sea: #6FC0CC; --sea-deep: #8FD2DC; --sea-soft: #1D3438; --coral: #E0906C; --on-sea: #10181B;
      --red: #E08A85;
      --wave1: #14262B; --wave2: #1B343B; --wave3: #24454E;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0E1518; --card: #1C252A; --ink: #E9ECE7; --muted: #98A6A8; --line: #303C41;
    --sea: #6FC0CC; --sea-deep: #8FD2DC; --sea-soft: #1D3438; --coral: #E0906C; --on-sea: #10181B;
    --red: #E08A85;
    --wave1: #14262B; --wave2: #1B343B; --wave3: #24454E;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    display: grid; place-items: center; overflow: hidden;
  }
  .scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .waves { position: absolute; left: 0; right: 0; bottom: 0; height: 34vh; min-height: 190px; }
  .waves svg { position: absolute; bottom: 0; left: 0; width: 200%; height: 100%; }
  .w1 { opacity: .9; animation: drift 26s linear infinite; }
  .w2 { opacity: .8; animation: drift 18s linear infinite reverse; }
  .w3 { opacity: .95; animation: drift 12s linear infinite; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .w1, .w2, .w3 { animation: none; } }
  .sun {
    position: absolute; top: 12vh; right: 14vw; width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, var(--coral) 0%, transparent 70%); opacity: .5;
  }
  .gate {
    position: relative; z-index: 1; width: min(400px, calc(100vw - 40px));
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 34px 30px 30px; text-align: center;
    box-shadow: 0 2px 6px rgba(20,30,35,.08), 0 18px 50px rgba(20,30,35,.12);
  }
  .eyebrow { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--coral); font-weight: 600; }
  h1 {
    font-family: "Superclarendon", Rockwell, "Roboto Slab", "Bookman Old Style", Georgia, serif;
    font-size: 46px; margin: 8px 0 2px; line-height: 1.05;
  }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .seam { border: 0; border-top: 2px dashed var(--coral); opacity: .5; margin: 0 auto 24px; width: 70%; }
  form { display: grid; gap: 12px; }
  input[type="password"] {
    width: 100%; padding: 13px 15px; border-radius: 4px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); font: 16px "Avenir Next", "Segoe UI", system-ui, sans-serif;
    text-align: center; letter-spacing: .06em;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
  button {
    padding: 13px 16px; border-radius: 4px; border: 1px solid var(--sea);
    background: var(--sea); color: var(--on-sea); font: 600 15px "Avenir Next", "Segoe UI", system-ui, sans-serif;
    cursor: pointer; letter-spacing: .03em;
  }
  button[disabled] { opacity: .6; cursor: wait; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 18px; }
  .err { color: var(--red); font-size: 13.5px; font-weight: 600; min-height: 18px; margin: 0; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
  noscript { display: block; margin-top: 14px; color: var(--muted); font-size: 13px; }
</style>

  </div>
</div>

<main class="gate" id="gate">
  <div class="eyebrow">Aug 9 – 16 · Paradise Island</div>
  <h1>Nassau</h1>
  <p class="sub">Seven nights. One password.</p>
  <hr class="seam">
  <form id="f">
    <input type="password" id="pw" placeholder="password" autocomplete="current-password"
           autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Password" required>
    <button type="submit" id="go">Unlock the trip</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="hint">Hint: the street parade + the year the storms last hit the island.</p>
  <noscript>This page needs JavaScript to unlock.</noscript>
</main>

  const km = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);

    gate.classList.remove("shake"); void gate.offsetWidth; gate.classList.add("shake");

});
